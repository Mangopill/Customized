modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

issueTrackerURL="https://github.com/Mangopill/Customized/issues"

[[mods]]
modId="${mod_id}"

version="${minecraft_version}-forge-${mod_version}"

displayName="${mod_name}"

logoFile="logo.png"

authors="${mod_authors}"

credits = "${mod_credits}"

description='''${mod_description}'''

displayURL = "https://github.com/Mangopill/Customized"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
